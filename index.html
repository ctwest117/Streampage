<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Nerdflix</title>
</head>
<body class="m-0 text-white/100">
    <header class="fixed flex justify-between items-center top-0 w-screen bg-white/20 blur-bg-md rounded-lg">
        <h1 class="text-red-500">Nerdflix</h1>
        <nav>
            <button>Sign In</button>
            <button>Create Account</button>
        </nav>
    </header>
    <main>
        <section class="flex flex-col justify-center items-center w-screen h-screen bg-[url('images/bg_image.png')] bg-center">
            <h1>Movies and Shows for  the Nerdiest of Nerds</h1>
            <h2>Create an account or sign in now</h2>
            <p></p>
            <form id="email-form" class="flex flex-col items-center gap-3" novalidate>
                <label for="email" class="sr-only">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Email Adress"
                    autocomplete="email"
                    required
                    class="w-72 rounded border-2 border-white/60 bg-black/40 px-4 py-2 outline-none placeholder:text-white/70"
                >
                <button type="submit" class="rounded bg-red-600 px-5 py-2 font-semibold">
                    Get Started
                </button>
            </form>
        </section>
    </main>
</body>
</html>
